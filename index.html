<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Risco Hospitalar COVID-19</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #1e1e2e; color: #cdd6f4; padding: 20px; }
        .container { max-width: 480px; background: #181825; padding: 25px; border-radius: 12px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #89b4fa; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 12px; font-size: 0.9em; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; background-color: #313244; color: #fff; border: 1px solid #45475a; border-radius: 6px; }
        input:focus { outline: none; border-color: #89b4fa; }
        button { width: 100%; padding: 12px; background-color: #89b4fa; color: #11111b; font-weight: bold; border: none; margin-top: 20px; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #b4befe; }
        #resultado { margin-top: 20px; padding: 15px; text-align: center; font-weight: bold; border-radius: 6px; display: none; }
        .alto { background-color: #f38ba8; color: #11111b; }
        .baixo { background-color: #a6e3a1; color: #11111b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Previsão de Risco Hospitalar</h2>
    <form id="meuForm">
        <label>Ocupação UTI COVID:</label>
        <input type="number" id="uti_covid" value="0" required>

        <label>Ocupação Enfermaria COVID:</label>
        <input type="number" id="cli_covid" value="0" required>

        <label>Ocupação UTI Geral:</label>
        <input type="number" id="uti_hosp" value="0" required>

        <label>Ocupação Enfermaria Geral:</label>
        <input type="number" id="cli_hosp" value="0" required>

        <label>Saídas por Alta Confirmada:</label>
        <input type="number" id="altas" value="0" required>

        <button type="button" onclick="enviarPrevisao()">Analisar Risco</button>
    </form>

    <div id="resultado" style="display: none;">
        <h3 id="mensagemResultado"></h3>
        <!-- Container para centralizar e limitar o tamanho do gráfico -->
         <div style="max-width: 250px; margin: 20px auto;">
            <canvas id="graficoRisco"></canvas>
         </div>

    </div>
</div>

<script>
async function enviarPrevisao() {
    const dados = {
        ocupacaoCovidUti: parseFloat(document.getElementById('uti_covid').value),
        ocupacaoCovidCli: parseFloat(document.getElementById('cli_covid').value),
        ocupacaoHospitalarUti: parseFloat(document.getElementById('uti_hosp').value),
        ocupacaoHospitalarCli: parseFloat(document.getElementById('cli_hosp').value),
        saidaConfirmadaAltas: parseFloat(document.getElementById('altas').value)
    };

    try {
        const resposta = await fetch('http://127.0.0.1:8000/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });

        const json = await resposta.json();
        const divResultado = document.getElementById('resultado');
        
        divResultado.style.display = 'block';
        divResultado.innerText = json.mensagem;
        divResultado.className = json.risco_obito_detectado === 1 ? 'alto' : 'baixo';
    } catch (erro) {
        alert("Erro ao se conectar com o servidor Backend. Certifique-se de que o Uvicorn está rodando!");
    }
}
</script>

</body>
</html>
