services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: covid-api
    environment:
      DATABASE_URL: sqlite:////data/historico.db
    volumes:
      - historico_data:/data        # histórico persiste entre recriações
    ports:
      - "8000:8000"                 # Swagger: http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: covid-front
    environment:
      API_URL: http://api:8000              # comunicação interna entre contêineres
      API_PUBLIC_URL: http://localhost:8000 # link do Swagger no navegador
    ports:
      - "8501:8501"                 # Painel: http://localhost:8501
    depends_on:
      api:
        condition: service_healthy  # só sobe o front quando a API responde
    restart: unless-stopped

volumes:
  historico_data: